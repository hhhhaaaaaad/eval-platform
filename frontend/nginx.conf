# 评测平台前端 nginx 配置。
#
# /api/ 反代目标默认指向 Compose 网络内的后端服务 eval-api:8093
# （见 deploy/docker-compose.yml 的 eval-api 服务）。若后端地址不同，
# 直接改下面 proxy_pass 即可；也可在部署时用环境变量注入覆盖（把本文件
# 改名为 *.template 放进 /etc/nginx/templates/，nginx 官方镜像会自动 envsubst）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback：前端路由（如 /datasets/1）没有对应静态文件时，
    # 回退到 index.html 交由 React Router 处理，避免刷新 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端。proxy_pass 不带 URI 后缀，/api/v1/... 前缀原样透传，
    # 与后端 app.main 挂载的 /api/v1 路由保持一致。
    location /api/ {
        proxy_pass http://eval-api:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
