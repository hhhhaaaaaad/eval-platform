[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# NOTE: sqlalchemy.url is intentionally omitted here. The real URL is injected by
# alembic/env.py from app.settings.config.get_settings(), so migrations and the API
# always read the same configuration.
#
# KEEP THIS FILE ASCII-ONLY. configparser reads it with the system locale encoding
# (GBK on zh-CN Windows), so non-ASCII comments make every `alembic` command crash
# with UnicodeDecodeError before it even starts.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
